<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure E2EE Comm</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        #chat-box { width: 100%; height: 300px; border: 1px solid #ccc; background: #fff; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 8px; padding: 5px; border-radius: 4px; }
        .sent { background-color: #d1e7dd; text-align: right; }
        .received { background-color: #f8d7da; text-align: left; }
        .system { background-color: #e2e3e5; text-align: center; font-style: italic; font-size: 0.9em; }
        input[type="text"] { width: 80%; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>

    <h2>Secure Communication app (E2EE)</h2>
    <div id="chat-box"></div>
    
    <input type="text" id="message-input" placeholder="Type your secure message here..." autocomplete="off">
    <button onclick="sendChatMessage()">Send Encrypted</button>

    <script src="/static/crypto_chat.js"></script>
</body>
</html>
